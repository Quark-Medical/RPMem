[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpmem"
version = "0.1.0"
description = "Recurrent parametric memory for language models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
train = ["accelerate>=1.0", "tensorboard>=2.16", "pyarrow>=14", "PyYAML>=6"]
experiments = ["huggingface-hub>=0.30", "pyarrow>=14", "PyYAML>=6"]
flash = ["flash-attn>=2.0"]
dev = ["build>=1.2"]

[project.urls]
Repository = "https://github.com/Quark-Medical/rpmem"
Homepage = "https://quark-medical.github.io/rpmem/"
Paper = "https://arxiv.org/abs/2609.23466"

[tool.setuptools.packages.find]
include = ["rpmem", "rpmem.*"]
